services:
  app:
    image: node:20-alpine
    working_dir: /app
    command:
      - node
      - -e
      - |
        require('http').createServer((req, res) => {
          res.writeHead(200, {'Content-Type':'application/json'});
          res.end(JSON.stringify({
            mensaje: 'Aplicacion Docker Compose funcionando',
            institucion: 'Universidad del Quindio'
          }));
        }).listen(3000, '0.0.0.0');
    ports:
      - "3001:3000"
    restart: unless-stopped

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin_compose
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: compose_db
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  db-service:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: compose_db
      MYSQL_USER: admin_compose
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db-service
      PMA_PORT: 3306
    depends_on:
      - db-service
    restart: unless-stopped

volumes:
  mongo-data:
  mysql-data:
